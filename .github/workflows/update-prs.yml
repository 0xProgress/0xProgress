name: Update README Stats

on:
  schedule:
    - cron: '0 6,18 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # PR counts
          MERGED=$(gh search prs --author 0xProgress --state merged --limit 100 --json id | jq length)
          OPEN=$(gh search prs --author 0xProgress --state open --limit 100 --json id | jq length)
          ISSUES=$(gh search issues --author 0xProgress --state closed --limit 100 --json id | jq length)

          # Recent 3 merged PRs
          PRS=$(gh search prs --author 0xProgress --state merged --limit 3 --json title,url,repository --jq '.[] | "- **[\(.repository.nameWithOwner)]:** \(.title) ([PR](\(.url)))"')
          [ -z "$PRS" ] && PRS="*No merged PRs yet — working on it.*"

          STATS="| 🟢 Merged | 🟡 Open | 📝 Issues |\n|---|---|---|\n| $MERGED | $OPEN | $ISSUES |"

          # Write to temp files
          echo "$STATS" > /tmp/stats.txt
          echo "$PRS" > /tmp/prs.txt

      - name: Update README
        run: |
          STATS=$(cat /tmp/stats.txt)
          PRS=$(cat /tmp/prs.txt)

          # Use Python for reliable replacement
          python3 << PYEOF
          import re

          with open("README.md", "r") as f:
              content = f.read()

          content = re.sub(
              r"<!-- STATS:START -->.*?<!-- STATS:END -->",
              f"<!-- STATS:START -->\n$STATS\n<!-- STATS:END -->",
              content,
              flags=re.DOTALL
          )

          content = re.sub(
              r"<!-- PR-LIST:START -->.*?<!-- PR-LIST:END -->",
              f"<!-- PR-LIST:START -->\n$PRS\n<!-- PR-LIST:END -->",
              content,
              flags=re.DOTALL
          )

          with open("README.md", "w") as f:
              f.write(content)
          PYEOF

      - name: Commit if changed
        run: |
          git config user.name "0xProgress"
          git config user.email "progressuwhuseba@gmail.com"
          git add README.md
          git diff --staged --quiet || git commit -m "Update stats and PRs"
          git push
