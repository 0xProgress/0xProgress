name: Update README Stats

on:
  schedule:
    - cron: '0 6,18 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # PR counts
          MERGED=$(gh search prs --author 0xProgress --merged --limit 100 --json id | jq length)
          OPEN=$(gh search prs --author 0xProgress --state open --limit 100 --json id | jq length)
          ISSUES=$(gh search issues --author 0xProgress --state closed --limit 100 --json id | jq length)

          # Latest commits from all repos (last 3)
          COMMITS=$(gh search commits --author 0xProgress --limit 3 --json repository,message,url --jq '.[] | "📝 [\(.repository.name)] \(.message | split("\n")[0])"')
          [ -z "$COMMITS" ] && COMMITS="*No recent commits — building something soon.*"

          # Recent 3 merged PRs
          PRS=$(gh search prs --author 0xProgress --merged --limit 3 --json title,url,repository --jq '.[] | "- [\(.repository.name)]: \(.title) ([PR](\(.url)))"')
          [ -z "$PRS" ] && PRS="*No merged PRs yet — working on it.*"

          echo "MERGED=$MERGED" >> $GITHUB_ENV
          echo "OPEN=$OPEN" >> $GITHUB_ENV
          echo "ISSUES=$ISSUES" >> $GITHUB_ENV
          echo "COMMITS<<EOF" >> $GITHUB_ENV
          echo "$COMMITS" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          echo "PRS<<EOF" >> $GITHUB_ENV
          echo "$PRS" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Update README
        run: |
          python3 << PYEOF
          import os
          import re

          with open("README.md", "r") as f:
              content = f.read()

          MERGED = os.environ.get("MERGED", "0")
          OPEN = os.environ.get("OPEN", "0")
          ISSUES = os.environ.get("ISSUES", "0")
          COMMITS = os.environ.get("COMMITS", "*No recent commits — building something soon.*")

          # Update stats
          stats = f"""| 🟢 Merged | 🟡 Open | 📝 Issues |
          |:---:|:---:|:---:|
          | {MERGED} | {OPEN} | {ISSUES} |"""
          content = re.sub(
              r"<!-- STATS:START -->.*?<!-- STATS:END -->",
              f"<!-- STATS:START -->\n{stats}\n<!-- STATS:END -->",
              content,
              flags=re.DOTALL
          )

          # Update commits
          commits = f"{COMMITS}"
          content = re.sub(
              r"<!-- LATEST_COMMITS:START -->.*?<!-- LATEST_COMMITS:END -->",
              f"<!-- LATEST_COMMITS:START -->\n{commits}\n<!-- LATEST_COMMITS:END -->",
              content,
              flags=re.DOTALL
          )

          with open("README.md", "w") as f:
              f.write(content)
          PYEOF
        env:
          MERGED: ${{ env.MERGED }}
          OPEN: ${{ env.OPEN }}
          ISSUES: ${{ env.ISSUES }}
          COMMITS: ${{ env.COMMITS }}

      - name: Commit if changed
        run: |
          git config user.name "0xProgress"
          git config user.email "progressuwhuseba@gmail.com"
          git add README.md
          git diff --staged --quiet || git commit -m "📊 Update stats and commits [skip ci]"
          git push
