name: Update README Stats

on:
  schedule:
    - cron: "30 2 * * 2,4,6"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch stats
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          set -uo pipefail

          echo "🔍 Fetching PR and Issue counts..."
          MERGED=$(gh search prs --author="0xProgress" --merged --limit 100 --json id --jq 'length' 2>/dev/null || echo "0")
          OPEN=$(gh search prs --author="0xProgress" --state open --limit 100 --json id --jq 'length' 2>/dev/null || echo "0")
          ISSUES=$(gh search issues --author="0xProgress" --state closed --limit 100 --json id --jq 'length' 2>/dev/null || echo "0")

          echo "⭐ Fetching stars and followers..."
          STARS=$(gh repo list 0xProgress --source --limit 1000 --json stargazerCount --jq '[.[].stargazerCount] | add // 0' 2>/dev/null || echo "0")
          FOLLOWERS=$(gh api user --jq '.followers' 2>/dev/null || echo "0")

          echo "📦 Fetching repositories (non-fork, filtered)..."
          REPOS=$(gh repo list 0xProgress --source --limit 1000 --json name --jq '.[].name | select(. != "0xProgress.github.io" and . != "0xProgress" and . != "verbose-octo-fortnight")' 2>/dev/null || echo "")

          COMMITS=""
          if [ -n "$REPOS" ]; then
            echo "🔄 Processing repositories..."
            for repo in $REPOS; do
              COMMIT_DATA=$(gh api "repos/0xProgress/$repo/commits?per_page=5" 2>/dev/null || echo "[]")

              REAL_COMMIT=$(echo "$COMMIT_DATA" | jq 'if type == "array" then [.[] | select(.commit.message | contains("[skip ci]") | not)] | .[0] else null end' 2>/dev/null || echo "null")

              if [ "$REAL_COMMIT" != "null" ] && [ -n "$REAL_COMMIT" ] && [ "$REAL_COMMIT" != "" ]; then
                COMMIT_DATE=$(echo "$REAL_COMMIT" | jq -r '.commit.committer.date // "1970-01-01T00:00:00Z"' 2>/dev/null || echo "1970-01-01T00:00:00Z")
                COMMIT_MSG=$(echo "$REAL_COMMIT" | jq -r '.commit.message' 2>/dev/null | head -1 || echo "No message")
                REPO_NAME=$(echo "$REAL_COMMIT" | jq -r '.repository.name // empty' 2>/dev/null || echo "$repo")
                [ -z "$REPO_NAME" ] && REPO_NAME="$repo"

                COMMIT_MSG=$(echo "$COMMIT_MSG" | tr '|' ' ')

                COMMITS="${COMMITS}${COMMIT_DATE}|${REPO_NAME}|${COMMIT_MSG}\n"
              fi
            done
          else
            echo "⚠️ No repositories found or failed to fetch."
          fi

          if [ -n "$COMMITS" ]; then
            COMMITS=$(printf '%b' "$COMMITS" | sort -r | head -5 | while IFS='|' read -r date repo msg; do
              [ -n "${date:-}" ] || continue
              echo "- **$repo** - $msg"
            done)
          else
            COMMITS="*No recent commits found.*"
          fi

          echo "🔗 Fetching recent PRs..."
          PRS=$(gh search prs --author="0xProgress" --merged --limit 5 --json title,url,repository --jq '.[] | "- [\(.repository.name)]: \(.title) ([PR](\(.url)))"' 2>/dev/null || echo "")
          [ -z "$PRS" ] && PRS="*No merged PRs yet.*"

          echo "💾 Saving to GitHub Environment..."
          echo "MERGED=$MERGED" >> $GITHUB_ENV
          echo "OPEN=$OPEN" >> $GITHUB_ENV
          echo "ISSUES=$ISSUES" >> $GITHUB_ENV
          echo "STARS=$STARS" >> $GITHUB_ENV
          echo "FOLLOWERS=$FOLLOWERS" >> $GITHUB_ENV

          echo "COMMITS<<EOF" >> $GITHUB_ENV
          echo "$COMMITS" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          echo "PRS<<EOF" >> $GITHUB_ENV
          echo "$PRS" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          echo "✅ Done!"

      - name: Update README
        env:
          PYTHONIOENCODING: utf-8
          MERGED: ${{ env.MERGED }}
          OPEN: ${{ env.OPEN }}
          ISSUES: ${{ env.ISSUES }}
          STARS: ${{ env.STARS }}
          FOLLOWERS: ${{ env.FOLLOWERS }}
          COMMITS: ${{ env.COMMITS }}
          PRS: ${{ env.PRS }}
        run: |
          python3 << 'PYEOF'
          import os
          import re
          import sys

          sys.stdout.reconfigure(encoding="utf-8", errors="replace")

          with open("README.md", "r", encoding="utf-8") as f:
              content = f.read()

          MERGED = os.environ.get("MERGED", "0")
          OPEN = os.environ.get("OPEN", "0")
          ISSUES = os.environ.get("ISSUES", "0")
          STARS = os.environ.get("STARS", "0")
          FOLLOWERS = os.environ.get("FOLLOWERS", "0")
          COMMITS = os.environ.get("COMMITS", "*No recent commits found.*")
          PRS = os.environ.get("PRS", "*No merged PRs yet.*")

          stats = (
              "![Stars](https://img.shields.io/badge/stars-" + STARS + "-b45309?style=flat-square&labelColor=1a1815) "
              "![Followers](https://img.shields.io/badge/followers-" + FOLLOWERS + "-b45309?style=flat-square&labelColor=1a1815) "
              "![Merged](https://img.shields.io/badge/merged-" + MERGED + "-15803d?style=flat-square&labelColor=1a1815) "
              "![Open](https://img.shields.io/badge/open-" + OPEN + "-d97706?style=flat-square&labelColor=1a1815)"
          )

          content = re.sub(
              r"<!-- STATS:START -->.*?<!-- STATS:END -->",
              "<!-- STATS:START -->\n" + stats + "\n<!-- STATS:END -->",
              content,
              flags=re.DOTALL,
          )

          content = re.sub(
              r"<!-- LATEST_COMMITS:START -->.*?<!-- LATEST_COMMITS:END -->",
              "<!-- LATEST_COMMITS:START -->\n" + COMMITS + "\n<!-- LATEST_COMMITS:END -->",
              content,
              flags=re.DOTALL,
          )

          content = re.sub(
              r"<!-- LATEST_PRS:START -->.*?<!-- LATEST_PRS:END -->",
              "<!-- LATEST_PRS:START -->\n" + PRS + "\n<!-- LATEST_PRS:END -->",
              content,
              flags=re.DOTALL,
          )

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(content)
          PYEOF

      - name: Commit if changed
        run: |
          git config user.name "0xProgress"
          git config user.email "progressuwhuseba@gmail.com"
          git add README.md

          if ! git diff --staged --quiet; then
            git commit -m "📊 Update stats and commits [skip ci]"
            git push
          fi
